name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  tag:
    name: Auto-version Tag
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FIRST_WORD=$(git log -1 --format='%s' | awk '{print tolower($1)}')
          echo "First word of commit: $FIRST_WORD"

          case "$FIRST_WORD" in
            fix|update|feature|majeur) ;;
            *)
              echo "Prefix '$FIRST_WORD' does not trigger a tag. Skipping."
              exit 0
              ;;
          esac

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest semver tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$FIRST_WORD" in
            fix)
              PATCH=$((PATCH + 1))
              ;;
            update|feature)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            majeur)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
