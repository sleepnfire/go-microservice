name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create the GitHub Release for (empty = latest tag)'
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tag:
    name: Auto-version Tag
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and push version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First word, lowercased, without trailing punctuation/scope:
          # "feature: x", "Fix(api): x" and "fix x" are all accepted.
          FIRST_WORD=$(git log -1 --format='%s' | awk '{print tolower($1)}' | sed -E 's/[^a-z].*$//')
          echo "First word of commit: $FIRST_WORD"

          case "$FIRST_WORD" in
            fix|update|feature|majeur) ;;
            *)
              echo "Prefix '$FIRST_WORD' does not trigger a tag. Skipping."
              exit 0
              ;;
          esac

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest semver tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$FIRST_WORD" in
            fix)
              PATCH=$((PATCH + 1))
              ;;
            update|feature)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            majeur)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  # Ensures the GitHub Release exists (idempotent):
  # - push to main: latest semver tag (just created by `tag`, or a backfill);
  # - tag pushed by hand: that tag;
  # - manual run: the given tag, or the latest one.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test, tag]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      needs.tag.result != 'failure' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "No semver tag yet. Skipping."
            exit 0
          fi
          echo "Release for $TAG"
          .github/scripts/release.sh "$TAG"
